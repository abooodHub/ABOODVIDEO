user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_x_request_id $req_id {
        "~^[a-zA-Z0-9_\-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    # Only the dedicated embed page may be framed. Empty header values are omitted by nginx.
    map $uri $frame_options {
        default SAMEORIGIN;
        ~^/embed/ "";
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" req_id="$req_id"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting & Connection Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Playback fans out into playlists, segments and subtitles. Independent
    # sessions behind one NAT must not all compete for the general API budget.
    # This key is a scheduling hint, never an authentication decision: the API
    # validates the session AND cookie. Rotating forged IDs cannot evade the
    # separate aggregate IP ceiling below.
    map $uri $playback_session_key {
        "~^/api/v1/playback/s/([A-Za-z0-9_-]{20,128})/" "$binary_remote_addr:$1";
        default $binary_remote_addr;
    }
    limit_req_zone $playback_session_key zone=playback_session:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=playback_ip:10m rate=120r/s;
    limit_conn_zone $playback_session_key zone=playback_session_conn:10m;
    limit_conn_zone $binary_remote_addr zone=playback_ip_conn:10m;

    include /etc/nginx/conf.d/*.conf;
}
